<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TermuxSentinel AI - Secure Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 flex flex-col h-screen">

    <!-- Login Modal Overlay -->
    <div id="login-modal" class="fixed inset-0 bg-gray-950/90 backdrop-blur-md flex items-center justify-center p-4 z-50">
        <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl max-w-sm w-full shadow-2xl space-y-4">
            <div class="text-center space-y-1">
                <div class="w-10 h-10 bg-emerald-600 rounded-full flex items-center justify-center font-bold text-white mx-auto">AI</div>
                <h2 class="text-xl font-bold text-white">TermuxSentinel Access</h2>
                <p class="text-xs text-gray-400">Enter your authorized username & password</p>
            </div>
            
            <form id="login-form" class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Username</label>
                    <input id="login-username" type="text" required placeholder="Joel, Natalia, Farrell, Liam, Guest" 
                        class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-500 text-white placeholder-gray-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Password</label>
                    <input id="login-password" type="password" required placeholder="Enter password" 
                        class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-500 text-white placeholder-gray-500">
                </div>
                <div id="login-error" class="hidden text-red-400 text-xs text-center font-medium">Invalid username or password.</div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 rounded-xl transition text-sm">Log In</button>
            </form>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-gray-900 border-b border-gray-800 p-4 flex items-center justify-between shadow-md">
        <div class="flex items-center space-x-3">
            <div class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></div>
            <h1 class="font-bold text-lg text-emerald-400">TermuxSentinel</h1>
        </div>
        <div class="flex items-center space-x-3">
            <span id="active-user-badge" class="hidden text-xs text-emerald-400 bg-emerald-950/60 border border-emerald-800/50 px-2.5 py-1 rounded-full font-mono"></span>
            <span class="text-xs text-gray-400 bg-gray-800 px-2.5 py-1 rounded-full">Offline Android AI</span>
        </div>
    </header>

    <!-- Chat Container -->
    <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-3xl w-full mx-auto">
        <div class="flex items-start space-x-3">
            <div class="bg-emerald-600 text-white rounded-full w-8 h-8 flex items-center justify-center font-bold text-sm shrink-0">AI</div>
            <div class="bg-gray-800 p-3.5 rounded-2xl max-w-[80%] text-sm shadow-sm border border-gray-700">
                Hello! I am <strong>TermuxSentinel</strong>, running live from an Android device via Termux. Access granted! How can I help you today?
            </div>
        </div>
    </div>

    <!-- Input Area -->
    <div class="bg-gray-900 border-t border-gray-800 p-4">
        <form id="chat-form" class="max-w-3xl mx-auto flex gap-2">
            <input id="user-input" type="text" placeholder="Type a message to TermuxSentinel..." 
                class="flex-1 bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 text-white placeholder-gray-500">
            <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-6 py-3 rounded-xl transition text-sm">Send</button>
        </form>
    </div>

    <script>
        // Update this URL whenever your cloudflared tunnel restarts
        const API_URL = "https://ctrl-javascript-primary-weblog.trycloudflare.com/v1/chat/completions";

        // Authorized users and their passwords
        const ALLOWED_USERS = {
            "Joel": "admin123",
            "Natalia": "natalia2026",
            "Farrell": "farrell2026",
            "Liam": "liam2026",
            "Guest": "guestpass"
        };

        const loginModal = document.getElementById('login-modal');
        const loginForm = document.getElementById('login-form');
        const loginError = document.getElementById('login-error');
        const activeUserBadge = document.getElementById('active-user-badge');

        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');

        let authenticatedUser = null;
        let messages = [
            { role: "system", content: "You are TermuxSentinel, an offline AI running locally on an Android phone inside Termux." }
        ];

        // Handle Login
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value.trim();

            if (ALLOWED_USERS[username] && ALLOWED_USERS[username] === password) {
                authenticatedUser = username;
                loginModal.classList.add('hidden');
                activeUserBadge.textContent = `@${username}`;
                activeUserBadge.classList.remove('hidden');
            } else {
                loginError.classList.remove('hidden');
            }
        });

        // Handle Chat Submission
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!authenticatedUser) return;

            const text = userInput.value.trim();
            if (!text) return;

            appendMessage('User', text, 'bg-blue-600 ml-auto');
            messages.push({ role: "user", content: text });
            userInput.value = '';

            const loadingId = 'loading-' + Date.now();
            appendMessage('AI', 'Thinking...', 'bg-gray-800 border border-gray-700', loadingId);

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: "local-model",
                        messages: messages,
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                const reply = data.choices[0].message.content;

                document.getElementById(loadingId).remove();
                appendMessage('AI', reply, 'bg-gray-800 border border-gray-700');
                messages.push({ role: "assistant", content: reply });
            } catch (err) {
                document.getElementById(loadingId).remove();
                appendMessage('AI', '[-] Failed to reach your phone server. Make sure Termux and Cloudflare are running!', 'bg-red-900 border border-red-700');
            }
        });

        function appendMessage(sender, text, bubbleClasses, id = '') {
            const isUser = sender === 'User';
            const div = document.createElement('div');
            div.className = `flex items-start space-x-3 ${isUser ? 'flex-row-reverse space-x-reverse' : ''}`;
            if (id) div.id = id;

            div.innerHTML = `
                <div class="${isUser ? 'bg-blue-600' : 'bg-emerald-600'} text-white rounded-full w-8 h-8 flex items-center justify-center font-bold text-sm shrink-0">${isUser ? 'U' : 'AI'}</div>
                <div class="${bubbleClasses} p-3.5 rounded-2xl max-w-[80%] text-sm shadow-sm whitespace-pre-wrap">${text}</div>
            `;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
